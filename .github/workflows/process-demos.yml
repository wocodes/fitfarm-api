name: Process Demo Tenants

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: process-demo-tenants
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          API_SSH_TARGET_ROOT: ${{ secrets.API_SSH_TARGET_ROOT }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY API_SSH_TARGET_ROOT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Prepare SSH key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null

      - name: Expire and purge demo tenants
        env:
          TARGET: ${{ secrets.API_SSH_TARGET_ROOT }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PHP_BIN: ${{ secrets.PHP_BIN || '/opt/alt/php83/usr/bin/php' }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "cd '$TARGET' && '$PHP_BIN' artisan demos:process --no-interaction"
