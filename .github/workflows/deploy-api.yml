name: Deploy FitFarmHQ API

on:
  push:
    branches: [main, master, staging]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'routes/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, pdo_sqlite, fileinfo, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php artisan test --compact

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'staging' && 'staging' || 'production') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_URL: ${{ secrets.APP_URL }}
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          API_SSH_TARGET_ROOT: ${{ secrets.API_SSH_TARGET_ROOT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BACHS_SECRET_KEY: ${{ secrets.BACHS_SECRET_KEY }}
          BACHS_WEBHOOK_SECRET: ${{ secrets.BACHS_WEBHOOK_SECRET }}
          BACHS_BASE_URL: ${{ secrets.BACHS_BASE_URL || 'https://api.bachs.io' }}
        run: |
          missing=()
          for name in \
            SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_KEY APP_ENV APP_URL \
            API_PUBLIC_URL API_SSH_TARGET_ROOT DB_DATABASE DB_USERNAME \
            DB_PASSWORD BACHS_SECRET_KEY BACHS_WEBHOOK_SECRET
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub secrets for this environment: ${missing[*]}"
            exit 1
          fi

          case "$BACHS_SECRET_KEY" in
            sk_sandbox_*)
              case "$BACHS_BASE_URL" in *sandbox-api.bachs.io*) ;; *)
                echo "::error::Sandbox Bachs key requires BACHS_BASE_URL=https://sandbox-api.bachs.io"; exit 1;;
              esac
              ;;
            sk_live_*)
              case "$BACHS_BASE_URL" in https://api.bachs.io) ;; *)
                echo "::error::Live Bachs key requires BACHS_BASE_URL=https://api.bachs.io"; exit 1;;
              esac
              ;;
            *)
              echo "::error::BACHS_SECRET_KEY must start with sk_sandbox_ or sk_live_"; exit 1;;
          esac

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, pdo_mysql, fileinfo, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Validate composer
        run: composer validate --strict

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Generate production .env
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL || 'https://api.fitfarmhq.com' }}
          PLATFORM_DOMAIN: ${{ secrets.PLATFORM_DOMAIN || 'fitfarmhq.com' }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || 'https://fitfarmhq.com,https://admin.fitfarmhq.com' }}
          CORS_ALLOWED_ORIGIN_PATTERNS: ${{ secrets.CORS_ALLOWED_ORIGIN_PATTERNS || '' }}
          DB_HOST: ${{ secrets.DB_HOST || '127.0.0.1' }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BACHS_SECRET_KEY: ${{ secrets.BACHS_SECRET_KEY }}
          BACHS_WEBHOOK_SECRET: ${{ secrets.BACHS_WEBHOOK_SECRET }}
          BACHS_BASE_URL: ${{ secrets.BACHS_BASE_URL || 'https://api.bachs.io' }}
          BACHS_CURRENCY: ${{ secrets.BACHS_CURRENCY || 'NGN' }}
          BACHS_DEMO_SECRET_KEY: ${{ secrets.BACHS_DEMO_SECRET_KEY || '' }}
          BACHS_DEMO_BASE_URL: ${{ secrets.BACHS_DEMO_BASE_URL || 'https://sandbox-api.bachs.io' }}
          BACHS_DEMO_WEBHOOK_SECRET: ${{ secrets.BACHS_DEMO_WEBHOOK_SECRET || '' }}
          DEMO_DURATION_DAYS: ${{ secrets.DEMO_DURATION_DAYS || '30' }}
          DEMO_GRACE_DAYS: ${{ secrets.DEMO_GRACE_DAYS || '7' }}
          MAIL_MAILER: ${{ secrets.MAIL_MAILER || 'log' }}
          MAIL_HOST: ${{ secrets.MAIL_HOST || '' }}
          MAIL_PORT: ${{ secrets.MAIL_PORT || '587' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME || '' }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD || '' }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS || 'no-reply@fitfarmhq.com' }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME || 'FitFarmHQ' }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL || '' }}
          SUPER_ADMIN_NAME: ${{ secrets.SUPER_ADMIN_NAME || 'Platform Admin' }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD || '' }}
        run: |
          printf '%s\n' \
            'APP_NAME=FitFarmHQ' \
            "APP_ENV=$APP_ENV" \
            'APP_DEBUG=false' \
            "APP_URL=$APP_URL" \
            "APP_KEY=$APP_KEY" \
            'APP_LOCALE=en' \
            'APP_FALLBACK_LOCALE=en' \
            'APP_FAKER_LOCALE=en_US' \
            'APP_MAINTENANCE_DRIVER=file' \
            'BCRYPT_ROUNDS=12' \
            'LOG_CHANNEL=stack' \
            'LOG_STACK=single' \
            'LOG_LEVEL=error' \
            'DB_CONNECTION=mysql' \
            "DB_HOST=$DB_HOST" \
            "DB_PORT=$DB_PORT" \
            "DB_DATABASE=$DB_DATABASE" \
            "DB_USERNAME=$DB_USERNAME" \
            "DB_PASSWORD=$DB_PASSWORD" \
            'SESSION_DRIVER=database' \
            'SESSION_LIFETIME=120' \
            'SESSION_ENCRYPT=false' \
            'SESSION_PATH=/' \
            'SESSION_DOMAIN=null' \
            'BROADCAST_CONNECTION=log' \
            'FILESYSTEM_DISK=local' \
            'QUEUE_CONNECTION=database' \
            'CACHE_STORE=database' \
            "MAIL_MAILER=$MAIL_MAILER" \
            'MAIL_SCHEME=null' \
            "MAIL_HOST=$MAIL_HOST" \
            "MAIL_PORT=$MAIL_PORT" \
            "MAIL_USERNAME=$MAIL_USERNAME" \
            "MAIL_PASSWORD=$MAIL_PASSWORD" \
            "MAIL_FROM_ADDRESS=$MAIL_FROM_ADDRESS" \
            "MAIL_FROM_NAME=$MAIL_FROM_NAME" \
            "PLATFORM_DOMAIN=$PLATFORM_DOMAIN" \
            "CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS" \
            "CORS_ALLOWED_ORIGIN_PATTERNS=$CORS_ALLOWED_ORIGIN_PATTERNS" \
            "BACHS_SECRET_KEY=$BACHS_SECRET_KEY" \
            "BACHS_WEBHOOK_SECRET=$BACHS_WEBHOOK_SECRET" \
            "BACHS_BASE_URL=$BACHS_BASE_URL" \
            "BACHS_CURRENCY=$BACHS_CURRENCY" \
            "BACHS_DEMO_SECRET_KEY=$BACHS_DEMO_SECRET_KEY" \
            "BACHS_DEMO_BASE_URL=$BACHS_DEMO_BASE_URL" \
            "BACHS_DEMO_WEBHOOK_SECRET=$BACHS_DEMO_WEBHOOK_SECRET" \
            "DEMO_DURATION_DAYS=$DEMO_DURATION_DAYS" \
            "DEMO_GRACE_DAYS=$DEMO_GRACE_DAYS" \
            "SUPER_ADMIN_EMAIL=$SUPER_ADMIN_EMAIL" \
            "SUPER_ADMIN_NAME=$SUPER_ADMIN_NAME" \
            "SUPER_ADMIN_PASSWORD=$SUPER_ADMIN_PASSWORD" \
            'SANCTUM_EXPIRATION=10080' \
            'VITE_APP_NAME=FitFarmHQ' \
            > .env
          test -s .env
          test -n "$APP_KEY"

      - name: Prepare SSH key
        id: prepare_ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null

      - name: Enable maintenance mode
        env:
          TARGET: ${{ secrets.API_SSH_TARGET_ROOT }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          PHP_BIN: ${{ secrets.PHP_BIN || '/opt/alt/php83/usr/bin/php' }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '$TARGET' && '$PHP_BIN' artisan down --retry=60 || true"

      - name: Rsync application to Hostinger
        env:
          TARGET: ${{ secrets.API_SSH_TARGET_ROOT }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '/.htaccess' \
            --exclude '/.user.ini' \
            --exclude '.claude' \
            --exclude '.junie' \
            --exclude '.mcp.json' \
            --exclude 'boost.json' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'phpunit.xml' \
            --exclude 'database/database.sqlite' \
            --exclude 'storage/app/*' \
            --exclude 'storage/logs/*' \
            --exclude 'storage/framework/cache/*' \
            --exclude 'storage/framework/down' \
            --exclude 'storage/framework/sessions/*' \
            --exclude 'storage/framework/testing/*' \
            --exclude 'storage/framework/views/*' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${TARGET}/"

      - name: Run post-deploy commands
        env:
          TARGET: ${{ secrets.API_SSH_TARGET_ROOT }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          PHP_BIN: ${{ secrets.PHP_BIN || '/opt/alt/php83/usr/bin/php' }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "\
            cd '$TARGET' && \
            chmod -R 775 storage bootstrap/cache && \
            '$PHP_BIN' artisan migrate --force && \
            ('$PHP_BIN' artisan storage:link || true) && \
            '$PHP_BIN' artisan optimize && \
            '$PHP_BIN' artisan up"

      - name: Verify API health
        env:
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "${API_PUBLIC_URL}/up" >/dev/null; then
              echo "API health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "::error::API health check failed after deployment."
          exit 1

      - name: Ensure maintenance mode is disabled
        if: always() && steps.prepare_ssh.outcome == 'success'
        env:
          TARGET: ${{ secrets.API_SSH_TARGET_ROOT }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          PHP_BIN: ${{ secrets.PHP_BIN || '/opt/alt/php83/usr/bin/php' }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '$TARGET' && '$PHP_BIN' artisan up || true"
